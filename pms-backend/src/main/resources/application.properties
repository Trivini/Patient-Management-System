# Dynamic Port & Network Binding for Render Deployment
server.port=${PORT:10000}
server.address=0.0.0.0
spring.application.name=pms-backend

# Datasource Configuration (Supports DB_URL / DATABASE_URL, DB_USERNAME / DATABASE_USERNAME, DB_PASSWORD / DATABASE_PASSWORD)
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:h2:mem:pms_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${DATABASE_DRIVER:${DB_DRIVER:org.h2.Driver}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:*}

# AI Assistant Integration Configuration
ai.api.key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.base.url=${AI_BASE_URL:https://api.openai.com/v1}

# Swagger OpenAPI Documentation Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
