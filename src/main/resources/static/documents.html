<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PMS - Documents</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Documents Upload</h3>
    <div>
      <a class="btn btn-outline-secondary me-2" href="appointments.html">Appointments</a>
      <a class="btn btn-outline-primary" href="index.html">Home</a>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">Upload Report / Prescription</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-4">
          <input id="patientName" class="form-control" placeholder="Patient Name (optional)">
        </div>
        <div class="col-md-2">
          <input id="appointmentId" class="form-control" placeholder="Appointment ID (optional)">
        </div>
        <div class="col-md-4">
          <input id="file" type="file" class="form-control">
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" onclick="upload()">Upload</button>
        </div>
      </div>
      <div id="msg" class="mt-2"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between">
      <span>Uploaded Documents</span>
      <button class="btn btn-sm btn-outline-dark" onclick="load()">Refresh</button>
    </div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th><th>Patient</th><th>AppointmentId</th><th>File</th><th>Uploaded</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = "http://localhost:8080/api/documents";

async function upload(){
  const file = document.getElementById("file").files[0];
  const patientName = document.getElementById("patientName").value;
  const apIdRaw = document.getElementById("appointmentId").value;
  const appointmentId = apIdRaw ? Number(apIdRaw) : "";

  const msg = document.getElementById("msg");
  if(!file){
    msg.innerHTML = "<span class='text-danger'>Please choose a file</span>";
    return;
  }

  const fd = new FormData();
  fd.append("file", file);
  if(patientName) fd.append("patientName", patientName);
  if(appointmentId) fd.append("appointmentId", appointmentId);

  const res = await fetch(API + "/upload", { method:"POST", body: fd });

  if(res.ok){
    msg.innerHTML = "<span class='text-success'>Uploaded ✅</span>";
    load();
  } else {
    msg.innerHTML = "<span class='text-danger'>" + await res.text() + "</span>";
  }
}

async function load(){
  const res = await fetch(API);
  const data = await res.json();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  data.forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d.id}</td>
      <td>${d.patientName || ""}</td>
      <td>${d.appointmentId || ""}</td>
      <td>${d.originalFileName || ""}</td>
      <td>${d.uploadedAt || ""}</td>
      <td><a class="btn btn-sm btn-success" href="${API}/${d.id}/download">Download</a></td>
    `;
    tbody.appendChild(tr);
  });
}

load();
</script>
</body>
</html>
