<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PMS - Appointments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Appointments</h3>
    <div>
      <a class="btn btn-outline-secondary me-2" href="patients.html">Patients</a>
      <a class="btn btn-outline-primary" href="index.html">Home</a>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header">Book Appointment</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3">
          <input id="patientName" class="form-control" placeholder="Patient Name">
        </div>
        <div class="col-md-3">
          <input id="doctorName" class="form-control" placeholder="Doctor Name">
        </div>
        <div class="col-md-2">
          <input id="appointmentDate" class="form-control" placeholder="Date (YYYY-MM-DD)">
        </div>
        <div class="col-md-2">
          <input id="appointmentTime" class="form-control" placeholder="Time (HH:mm)">
        </div>
        <div class="col-md-2">
          <select id="status" class="form-select">
            <option value="BOOKED">BOOKED</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary mt-3" onclick="book()">Book</button>
      <span id="msg" class="ms-3"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Appointment List</div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = "http://localhost:8080/api/appointments";

async function load() {
  const res = await fetch(API);
  const data = await res.json();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(a => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.id}</td>
      <td>${a.patientName || ""}</td>
      <td>${a.doctorName || ""}</td>
      <td>${a.appointmentDate || ""}</td>
      <td>${a.appointmentTime || ""}</td>
      <td>
        <select class="form-select form-select-sm" onchange="changeStatus(${a.id}, this.value)">
          <option ${a.status==="BOOKED"?"selected":""}>BOOKED</option>
          <option ${a.status==="COMPLETED"?"selected":""}>COMPLETED</option>
          <option ${a.status==="CANCELLED"?"selected":""}>CANCELLED</option>
        </select>
      </td>
      <td>
        <button class="btn btn-sm btn-danger" onclick="del(${a.id})">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function book() {
  const payload = {
    patientName: document.getElementById("patientName").value,
    doctorName: document.getElementById("doctorName").value,
    appointmentDate: document.getElementById("appointmentDate").value,
    appointmentTime: document.getElementById("appointmentTime").value,
    status: document.getElementById("status").value
  };

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  const msg = document.getElementById("msg");
  if(res.ok){
    msg.innerText = "Booked ✅";
    msg.className = "text-success";
    load();
  } else {
    msg.innerText = await res.text();
    msg.className = "text-danger";
  }
}

async function changeStatus(id, status){
  await fetch(`${API}/${id}/status?status=${status}`, { method: "PUT" });
  load();
}

async function del(id){
  await fetch(`${API}/${id}`, { method: "DELETE" });
  load();
}

load();
</script>
</body>
</html>
