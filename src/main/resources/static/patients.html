<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PMS - Patients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Patient Management</h3>
    <a class="btn btn-outline-primary" href="index.html">Home</a>
  </div>

  <div class="card mb-4">
    <div class="card-header">Add Patient</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3">
          <input id="fullName" class="form-control" placeholder="Full Name">
        </div>
        <div class="col-md-2">
          <select id="gender" class="form-select">
            <option value="">Gender</option>
            <option>MALE</option>
            <option>FEMALE</option>
            <option>OTHER</option>
          </select>
        </div>
        <div class="col-md-2">
          <input id="dob" class="form-control" placeholder="DOB (YYYY-MM-DD)">
        </div>
        <div class="col-md-2">
          <input id="phone" class="form-control" placeholder="Phone (10 digits)">
        </div>
        <div class="col-md-3">
          <input id="address" class="form-control" placeholder="Address">
        </div>
      </div>
      <button class="btn btn-primary mt-3" onclick="addPatient()">Save</button>
      <span id="msg" class="ms-3"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Patients List</div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Gender</th><th>DOB</th><th>Phone</th><th>Address</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = "http://localhost:8080/api/patients";

async function loadPatients() {
  const res = await fetch(API);
  const data = await res.json();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.id}</td>
      <td>${p.fullName || ""}</td>
      <td>${p.gender || ""}</td>
      <td>${p.dob || ""}</td>
      <td>${p.phone || ""}</td>
      <td>${p.address || ""}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deletePatient(${p.id})">Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
}

async function addPatient() {
  const payload = {
    fullName: document.getElementById("fullName").value,
    gender: document.getElementById("gender").value,
    dob: document.getElementById("dob").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value
  };

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  const msg = document.getElementById("msg");
  if(res.ok){
    msg.innerText = "Saved ✅";
    msg.className = "text-success";
    loadPatients();
  } else {
    const err = await res.text();
    msg.innerText = err;
    msg.className = "text-danger";
  }
}

async function deletePatient(id){
  await fetch(API + "/" + id, { method: "DELETE" });
  loadPatients();
}

loadPatients();
</script>
</body>
</html>
