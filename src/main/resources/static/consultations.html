<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PMS - Consultation Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Consultation Notes</h3>
    <div>
      <a class="btn btn-outline-secondary me-2" href="appointments.html">Appointments</a>
      <a class="btn btn-outline-primary" href="index.html">Home</a>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-header">Add Notes</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-2">
          <input id="appointmentId" class="form-control" placeholder="Appointment ID">
        </div>
        <div class="col-md-3">
          <input id="symptoms" class="form-control" placeholder="Symptoms">
        </div>
        <div class="col-md-3">
          <input id="diagnosis" class="form-control" placeholder="Diagnosis">
        </div>
        <div class="col-md-4">
          <input id="prescription" class="form-control" placeholder="Prescription">
        </div>
      </div>

      <button class="btn btn-primary mt-3" onclick="saveNotes()">Save Notes</button>
      <button class="btn btn-outline-dark mt-3 ms-2" onclick="loadNotes()">Load Notes</button>
      <span id="msg" class="ms-3"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Notes List (by Appointment ID)</div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th><th>AppointmentID</th><th>Symptoms</th><th>Diagnosis</th><th>Prescription</th><th>Created</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = "http://localhost:8080/api/consultations";

async function saveNotes(){
  const payload = {
    appointmentId: Number(document.getElementById("appointmentId").value),
    symptoms: document.getElementById("symptoms").value,
    diagnosis: document.getElementById("diagnosis").value,
    prescription: document.getElementById("prescription").value
  };

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  });

  const msg = document.getElementById("msg");
  if(res.ok){
    msg.innerText = "Saved ✅";
    msg.className = "text-success";
    loadNotes();
  } else {
    msg.innerText = await res.text();
    msg.className = "text-danger";
  }
}

async function loadNotes(){
  const appointmentId = Number(document.getElementById("appointmentId").value);
  if(!appointmentId){
    alert("Enter Appointment ID");
    return;
  }

  const res = await fetch(`${API}/by-appointment/${appointmentId}`);
  const data = await res.json();
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(n => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${n.id}</td>
      <td>${n.appointmentId}</td>
      <td>${n.symptoms || ""}</td>
      <td>${n.diagnosis || ""}</td>
      <td>${n.prescription || ""}</td>
      <td>${n.createdAt || ""}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
